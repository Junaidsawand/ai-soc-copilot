version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: aisoc_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aisoc_network
    volumes:
      - ./backend:/app # Mount local code for hot reloading

  db:
    image: postgres:16-alpine
    container_name: aisoc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aisoc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local}
      POSTGRES_DB: ${POSTGRES_DB:-aisoc}
    ports:
      - "5432:5432"
    volumes:
      - aisoc_pgdata:/var/lib/postgresql/data
    networks:
      - aisoc_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aisoc_admin} -d ${POSTGRES_DB:-aisoc}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  aisoc_network:
    driver: bridge

volumes:
  aisoc_pgdata:
